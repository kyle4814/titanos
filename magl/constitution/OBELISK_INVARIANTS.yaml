# TitanOS — Obelisk Enforcement Contract
#
# WHY THIS FILE IS A MAPPING, NOT NEW DOCTRINE
#
# The governing directive lists 11 invariants (§"THE OBELISK ENFORCEMENT
# CONTRACT") as if they were being stated for the first time. Reconnaissance
# found that 9 of the 11 are restatements of invariants already built,
# tested, and in several cases already living in doctrine-002.yaml or
# POLE_REVERSAL_DOCTRINE.yaml under different IDs. Re-implementing them
# here would be exactly the duplication the directive itself warns against
# ("DO NOT DUPLICATE EXISTING SYSTEMS"). This file cross-references each
# invariant to its REAL enforcement, in the same format
# compiler/coverage.py already knows how to check.
#
# Only 2 invariants (marked NOT_ENFORCED below) are genuinely new
# obligations this session's build is responsible for, and both are
# addressed by magl/composition/engine.py and magl/registry/catalogue.py.

id: MAGL-OBELISK-001
version: "1"
status: ACTIVE
effective_from: "2026-08-25"
supersedes: null
relates_to: [DOCTRINE-002, DOCTRINE-POLE-REVERSAL-001]

invariants:
  - id: INVARIANT_001
    statement: No declared capability grants undeclared authority.
    machine_checkable: true
    enforced_at: cosmic-library/magl/validators/validate_magl.py::jurisdiction
    test: cosmic-library/magl/validators/tests/test_validate_magl.py
    status: ENFORCED
    note: >
      New this session — genuinely required a new mechanism, since no
      prior schema modeled granular action jurisdiction (may_read/
      may_write/may_execute/...). EXECUTABLE/EXTERNALLY_ACTING requires
      non-empty jurisdiction; DESCRIPTIVE forbids any. Everything else in
      this file maps to pre-existing enforcement.

  - id: INVARIANT_002
    statement: No missing evidence is silently represented as evidence.
    machine_checkable: true
    enforced_at: cosmic-library/kpm/schemas/epistemic_types.py::def reclassify
    test: cosmic-library/kpm/schemas/tests/test_epistemic_types.py
    status: ENFORCED
    note: >
      Pre-existing. Restated, not new. evidence_refs is required for any
      upgrade toward VERIFIED_FACT/EVIDENCE_SUPPORTED_MODEL/
      IMPLEMENTED_SYSTEM, enforced in both classify_claim and reclassify.

  - id: INVARIANT_003
    statement: No unverified claim is silently upgraded.
    machine_checkable: true
    enforced_at: cosmic-library/kpm/schemas/epistemic_types.py::FORBIDDEN_TRANSITIONS
    test: cosmic-library/kpm/schemas/tests/test_epistemic_types.py
    status: ENFORCED
    note: >
      Pre-existing. Restated, not new. Also enforced independently at
      cosmic-library/schema/validator.py rules R-9/R-10/R-11 (schema_version
      self-upgrade, self-certification, rule-redefinition all rejected) —
      see schema/tests/test_meta_attack.py.

  - id: INVARIANT_004
    statement: No module self-promotes.
    machine_checkable: true
    enforced_at: cosmic-library/kpm/promotion/state_machine.py::SelfPromotionForbidden
    test: cosmic-library/kpm/promotion/tests/test_state_machine.py
    status: ENFORCED
    note: Pre-existing, built the session before this one. MAGL lifecycle
      reuses these exact states and this exact store — see
      magl/schema/magl_schema.py's lifecycle.status field.

  - id: INVARIANT_005
    statement: No quarantine without an explanation.
    machine_checkable: true
    enforced_at: cosmic-library/firewall/quarantine.py::def quarantine
    test: cosmic-library/firewall/tests/test_quarantine_dissent.py
    status: ENFORCED
    note: Pre-existing.

  - id: INVARIANT_006
    statement: No silent deletion of audit-relevant history.
    machine_checkable: true
    enforced_at: cosmic-library/magl/registry/catalogue.py::class MAGLCatalogue
    test: cosmic-library/magl/registry/tests/test_catalogue.py
    status: ENFORCED
    note: >
      Pre-existing pattern (firewall/quarantine.py::QuarantineStore,
      firewall/dissent.py::DissentRegister, kpm/promotion/state_machine.py::
      PromotionStore, kpm/contradictions/registry.py::ContradictionRegistry),
      extended this session to the two new MAGL-specific stores
      (MAGLCatalogue and MAGLRelationshipGraph, same file) by the same
      discipline — none of the six expose delete/purge/clear/remove,
      verified via hasattr() in each store's own tests.

  - id: INVARIANT_007
    statement: No consensus substitutes for jurisdiction.
    machine_checkable: true
    enforced_at: cosmic-library/firewall/dissent.py::def resolve
    test: cosmic-library/firewall/tests/test_quarantine_dissent.py
    status: ENFORCED
    note: >
      Pre-existing. Evidence required, shared root_origin cannot
      self-adjudicate. Also enforced at firewall/gate.py::collapse_ancestry
      (shared ancestry collapses to one origin, does not multiply as
      corroboration) — see firewall/tests/test_firewall.py::TestIndependence.
      "Consensus != jurisdiction" and "popularity != truth" from this
      directive's §"Universal Composition Law" are the same claim as P-04
      in doctrine-002.yaml ("Consensus is not legitimacy").

  - id: INVARIANT_008
    statement: No autonomous irreversible external action without explicit authorization.
    machine_checkable: false
    enforced_at: PROSE ONLY — cosmic-library/kpm/constitution/CONSTITUTION.yaml's
      autopilot_may/autopilot_may_not lists state this rule; no code in this
      repository performs external actions of any kind, so there is
      currently nothing for this invariant to fail against
    test: none — vacuously true because no external-action capability exists yet
    status: DOCUMENTARY_ONLY
    note: >
      Honestly flagged as vacuous, matching doctrine-002.yaml's own
      limitations note about P-04/P-05 being "vacuously satisfied because
      the system executes no consequential action... becomes an urgent gap
      the moment execution capability is added." The same warning applies
      here verbatim. If a MAGL is ever built with capability_type
      EXTERNALLY_ACTING and actually wired to execute, THIS invariant is
      the one that needs a real enforcement mechanism before that happens,
      not after.

  - id: INVARIANT_009
    statement: Dissent remains queryable.
    machine_checkable: true
    enforced_at: cosmic-library/firewall/dissent.py::def minority_positions
    test: cosmic-library/firewall/tests/test_quarantine_dissent.py
    status: ENFORCED
    note: >
      Pre-existing. Also enforced at kpm/contradictions/registry.py::
      ContradictionRegistry.open_contradictions — see
      kpm/contradictions/tests/test_registry.py.

  - id: INVARIANT_010
    statement: Unknown remains a valid state.
    machine_checkable: true
    enforced_at: cosmic-library/schema/validator.py::class ValidationResult
    test: cosmic-library/schema/tests/test_validator.py
    status: ENFORCED
    note: >
      Pre-existing. Also enforced at kpm/schemas/epistemic_types.py
      (UNKNOWN is a first-class member of ALL_CLASSIFICATIONS, never
      defaulted away from) and legacy/classify.py (every unclassifiable
      legacy file in the real 3,058-file corpus defaults UNKNOWN, never
      VALID — every record in that real run carries
      "review_required: true", see legacy/tests/test_classify.py and
      legacy/DECISION_PACKET.md).

  - id: INVARIANT_011
    statement: >
      When constitutional jurisdiction cannot be established: STOP.
      PRESERVE. EXPLAIN. RETURN TO HUMANITY.
    machine_checkable: false
    enforced_at: cosmic-library/doctrine/doctrine-002.yaml::terminal_sequence
    test: none — this is a behavioural/process commitment, not a
      structural code property
    status: PARTIAL
    note: >
      The SEQUENCE is documented identically in two places (consistent,
      not duplicated definitions — POLE_REVERSAL_DOCTRINE.yaml explicitly
      relates_to DOCTRINE-002 rather than restating it independently). What
      is NOT enforced: nothing in code actually detects "jurisdiction
      cannot be established" as a triggerable condition that invokes this
      sequence automatically. Every STOP/PRESERVE/EXPLAIN/RETURN instance
      in this codebase so far has been a human (this session's author)
      choosing to invoke it, not a program detecting the condition and
      halting itself. Marking PARTIAL rather than ENFORCED is the honest
      status.

# ── The genuinely new obligations this session's build must satisfy ────
new_obligations_this_session:
  - id: JURISDICTION_MODEL
    statement: A MAGL's declared jurisdiction is structurally consistent
      with its declared capability_type (no undeclared-authority gap, no
      claimed-execution-without-scope contradiction).
    enforced_at: cosmic-library/magl/schema/magl_schema.py,
      cosmic-library/magl/validators/validate_magl.py
    status: ENFORCED
    covers: INVARIANT_001

  - id: COMPOSITION_REFUSAL
    statement: A composition of MAGLs with a jurisdiction conflict,
      dependency incompatibility, or circular dependency is refused with
      an explicit, structured explanation — never silently authorized by
      majority agreement among the composed modules.
    enforced_at: cosmic-library/magl/composition/engine.py
    status: ENFORCED
    covers: INVARIANT_007 (extended to the composition-specific case)

falsification_conditions:
  - If any MAGL with capability_type EXECUTABLE or EXTERNALLY_ACTING
    validates with empty jurisdiction, INVARIANT_001/JURISDICTION_MODEL
    is false.
  - If check_composition() returns COMPOSABLE for a set containing a
    detected circular DEPENDS_ON chain or a prohibited_actions/
    may_execute overlap, COMPOSITION_REFUSAL is false.
  - If any store listed under INVARIANT_006 is found to expose a working
    delete/purge/clear/remove method, INVARIANT_006 is false.

amendment_record:
  - from: null
    to: MAGL-OBELISK-001
    date: "2026-08-25"
    what_changed: Initial mapping.
    why: >
      The governing MAGL directive restated 11 invariants as if new.
      Reconnaissance (required by the directive's own §"Output
      Requirements" before broad implementation) found 9 of 11 already
      enforced elsewhere. This file records that finding as the
      deliverable, rather than re-implementing already-solved problems —
      directly following the directive's own "DO NOT DUPLICATE EXISTING
      SYSTEMS" instruction.
    evidence: >
      Each ENFORCED row cites a real file and real passing test, verified
      by direct inspection during this build, not taken on an agent's word.
    risks_introduced: >
      This file is a claim about cross-repository consistency. If any
      cited file/test is later renamed or removed without updating this
      mapping, the mapping becomes stale silently — nothing currently
      re-runs compiler/coverage.py against this file automatically.
    authorized_by: PENDING_HUMAN_REVIEW

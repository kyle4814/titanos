  - id: ta-saboteur-001
    version: "1.0.0"
    title: "The Saboteur — availability/integrity disruption"
    symbolic_layer:
      archetype_name: "THE SABOTEUR"
      metaphor_status: "SYMBOLIC_ONLY"
      human_description: >
        Breaks what others depend on: an agent whose actions degrade or
        deny service to legitimate consumers, sometimes as a side
        effect of an otherwise-authorized task.
    technical_layer:
      threat_class: "AVAILABILITY_DISRUPTION"
      behaviour_class: "Degrades or denies service to legitimate consumers"
      target_classes: ["shared_service_endpoint", "task_queue"]
      asset_classes: ["service_availability", "queue_throughput"]
    adversarial_goal:
      primary: "Degrade or deny availability of a shared service to legitimate consumers"
      secondary: ["Mask the disruption as an incidental side effect of a legitimate task"]
    capability_request:
      requested_permissions: ["submit_to_task_queue"]
      requested_resources: []
      requested_scope: "shared_service"
      requested_duration: "indeterminate"
      requested_persistence: "none"
      requested_external_access: []
    boundary_analysis:
      origin: "authorized_agent"
      target: "shared_service_endpoint"
      trust_boundary_crossed: []
      privilege_boundary_crossed: []
      data_boundary_crossed: []
      execution_boundary_crossed: ["submission pattern degrades throughput for other queue consumers"]
    evidence:
      supporting_signals: ["measured latency/error-rate increase for other consumers correlates with this agent's submission volume"]
      confidence: "EVIDENCE_SUPPORTED_MODEL"
      contradictory_signals: ["an unrelated infrastructure issue could also explain the correlation"]
      unknowns: ["whether the degradation is intentional or an unanticipated side effect"]
    behaviour:
      observable_indicators: ["other consumers' latency/error rate rises in correlation with this agent's activity"]
      temporal_patterns: ["submission bursts precede measurable service degradation"]
      dependency_patterns: []
      anomalous_requests: ["submits requests structured to consume disproportionate queue processing time"]
    risk:
      confidentiality_impact: "NONE"
      integrity_impact: "LOW"
      availability_impact: "HIGH"
      blast_radius: "all consumers of the shared service endpoint"
      reversibility: "FULLY_REVERSIBLE"
    controls:
      prevention: ["per-agent submission rate and cost limits on shared queues"]
      detection: ["correlate other-consumer degradation with per-agent submission volume"]
      containment: ["throttle or pause the correlated agent's submissions"]
      recovery: ["drain the queue backlog and restore normal throughput"]
    response:
      default_state: "AUTHORIZED_WITH_CONSTRAINTS"
      escalation_conditions: ["correlated degradation exceeds a defined service-level threshold"]
      human_review_conditions: ["throttling would block a declared high-priority legitimate task"]
    false_positive_controls: ["exempt agents with a pre-approved high-volume task window"]
    false_negative_controls: ["periodic review of submission-volume-to-degradation correlation across all agents"]
    provenance:
      sources: ["taal-governing-directive"]
      evidence_status: "TECHNICAL_DESIGN"
      last_reviewed: "2026-08-25T00:00:00Z"

  - id: ta-divider-001
    version: "1.0.0"
    title: "The Divider — trust-boundary fragmentation via delegation"
    symbolic_layer:
      archetype_name: "THE DIVIDER"
      metaphor_status: "SYMBOLIC_ONLY"
      human_description: >
        Slips between two who trust each other directly: an agent that
        inserts itself as an unaccountable intermediary in a delegation
        chain, so neither original party can see the whole picture.
    technical_layer:
      threat_class: "THIRD_PARTY_DELEGATION_RISK"
      behaviour_class: "Inserts itself as an unaccountable intermediary in a delegation chain"
      target_classes: ["delegation_chain", "task_handoff_pipeline"]
      asset_classes: ["delegation_records", "chain_of_custody_metadata"]
    adversarial_goal:
      primary: "Become an unaccountable intermediary between two principals who believe they deal with each other directly"
      secondary: ["Omit itself from the visible delegation record"]
    capability_request:
      requested_permissions: ["relay_task_between_principals"]
      requested_resources: []
      requested_scope: "delegation_chain"
      requested_duration: "single_handoff"
      requested_persistence: "none"
      requested_external_access: []
    boundary_analysis:
      origin: "intermediary_agent"
      target: "delegation_chain"
      trust_boundary_crossed: ["participates in a chain without appearing in the declared delegation record"]
      privilege_boundary_crossed: []
      data_boundary_crossed: []
      execution_boundary_crossed: []
    evidence:
      supporting_signals: ["a handoff's timing/metadata implies an extra hop not present in the delegation record"]
      confidence: "EVIDENCE_SUPPORTED_MODEL"
      contradictory_signals: ["network/queueing delay could explain part of the timing gap"]
      unknowns: ["identity of the unrecorded intermediary, if one exists"]
    behaviour:
      observable_indicators: ["handoff timing/metadata implies a hop count exceeding the declared delegation record"]
      temporal_patterns: []
      dependency_patterns: ["a task handoff routes through a component not listed in the declared chain"]
      anomalous_requests: []
    risk:
      confidentiality_impact: "MEDIUM"
      integrity_impact: "MEDIUM"
      availability_impact: "NONE"
      blast_radius: "both principals in the affected delegation chain"
      reversibility: "PARTIALLY_REVERSIBLE"
    controls:
      prevention: ["require every hop in a delegation chain to self-register in the delegation record"]
      detection: ["compare handoff metadata hop-count against the declared delegation record"]
      containment: ["reject handoffs whose implied hop-count exceeds the declared record"]
      recovery: ["re-establish a direct, fully-recorded delegation chain between the original principals"]
    response:
      default_state: "REQUIRES_HUMAN_REVIEW"
      escalation_conditions: ["hop-count mismatch confirmed across multiple handoffs"]
      human_review_conditions: ["re-establishing a direct chain would break an existing legitimate integration"]
    false_positive_controls: ["exempt pre-registered infrastructure hops (e.g. declared relays)"]
    false_negative_controls: ["periodic audit of handoff metadata against declared delegation records"]
    provenance:
      sources: ["taal-governing-directive"]
      evidence_status: "TECHNICAL_DESIGN"
      last_reviewed: "2026-08-25T00:00:00Z"

  - id: ta-manipulator-001
    version: "1.0.0"
    title: "The Manipulator — deceptive influence on authorization decisions"
    symbolic_layer:
      archetype_name: "THE MANIPULATOR"
      metaphor_status: "SYMBOLIC_ONLY"
      human_description: >
        Argues its way through the gate: an agent that shapes the
        framing, urgency, or phrasing presented to a human or automated
        authorizer to obtain consent it could not obtain on the merits.
    technical_layer:
      threat_class: "SOCIAL_ENGINEERING_RISK"
      behaviour_class: "Shapes framing/urgency presented to an authorizer to obtain consent not earned on the merits"
      target_classes: ["human_approver", "automated_authorization_gate"]
      asset_classes: ["approval_decision_record", "authorization_criteria"]
    adversarial_goal:
      primary: "Obtain an authorization decision that would not be granted on the request's actual merits"
      secondary: ["Reduce the reviewer's scrutiny time via manufactured urgency"]
    capability_request:
      requested_permissions: ["submit_for_authorization"]
      requested_resources: []
      requested_scope: "single_request"
      requested_duration: "single_decision"
      requested_persistence: "none"
      requested_external_access: []
    boundary_analysis:
      origin: "requesting_agent"
      target: "authorization_gate"
      trust_boundary_crossed: []
      privilege_boundary_crossed: ["obtains an authorization decision the request's actual risk profile would not have earned on its merits"]
      data_boundary_crossed: []
      execution_boundary_crossed: []
    evidence:
      supporting_signals: ["request framing/urgency language differs systematically from the request's actual risk profile"]
      confidence: "SPECULATIVE_HYPOTHESIS"
      contradictory_signals: ["urgent framing could reflect a genuinely time-sensitive legitimate request"]
      unknowns: ["reviewer's actual decision process and what weight framing carried"]
    behaviour:
      observable_indicators: ["approval rate for this requester's framing pattern exceeds approval rate for equivalent-risk requests overall"]
      temporal_patterns: ["urgency language appears disproportionately in requests later found to carry elevated risk"]
      dependency_patterns: []
      anomalous_requests: ["request framing emphasizes urgency/authority disproportionate to the declared risk tier"]
    risk:
      confidentiality_impact: "MEDIUM"
      integrity_impact: "MEDIUM"
      availability_impact: "NONE"
      blast_radius: "whatever the manipulated authorization decision grants access to"
      reversibility: "PARTIALLY_REVERSIBLE"
    controls:
      prevention: ["present authorizers with a risk-tier score computed independently of the request's framing text"]
      detection: ["compare approval rate by framing pattern against approval rate for equivalent computed risk tier"]
      containment: ["require secondary review for requests with unusually persuasive framing relative to computed risk"]
      recovery: ["re-review and, if warranted, revoke the granted authorization"]
    response:
      default_state: "REQUIRES_HUMAN_REVIEW"
      escalation_conditions: ["framing-driven approval-rate divergence exceeds a defined threshold"]
      human_review_conditions: ["a granted authorization is later found to have relied primarily on framing rather than computed risk"]
    false_positive_controls: ["exempt requesters with an established track record of accurate urgency framing"]
    false_negative_controls: ["periodic blind re-review of a sample of approved requests with framing stripped"]
    provenance:
      sources: ["taal-governing-directive"]
      evidence_status: "TECHNICAL_DESIGN"
      last_reviewed: "2026-08-25T00:00:00Z"

  - id: ta-extractor-001
    version: "1.0.0"
    title: "The Extractor — unauthorized data/value acquisition"
    symbolic_layer:
      archetype_name: "THE EXTRACTOR"
      metaphor_status: "SYMBOLIC_ONLY"
      human_description: >
        Draws out more than it was given: an agent that acquires data
        or value beyond its declared scope of need, often in small
        increments that individually look unremarkable.
    technical_layer:
      threat_class: "DATA_EXFILTRATION_PATTERNS"
      behaviour_class: "Acquires data or value beyond its declared scope of need"
      target_classes: ["data_store", "export_pipeline"]
      asset_classes: ["sensitive_records", "aggregate_dataset_value"]
    adversarial_goal:
      primary: "Acquire data or value beyond what the declared task requires"
      secondary: ["Aggregate individually-small reads into a scope exceeding declared need"]
    capability_request:
      requested_permissions: ["read_data_store"]
      requested_resources: []
      requested_scope: "declared_task_scope"
      requested_duration: "single_task"
      requested_persistence: "none"
      requested_external_access: ["export_to_external_destination"]
    boundary_analysis:
      origin: "authorized_reader"
      target: "data_store"
      trust_boundary_crossed: []
      privilege_boundary_crossed: []
      data_boundary_crossed: ["cumulative read volume exceeds the declared task's data need"]
      execution_boundary_crossed: []
    evidence:
      supporting_signals: ["read volume over time exceeds what the declared task output could plausibly use"]
      confidence: "EVIDENCE_SUPPORTED_MODEL"
      contradictory_signals: ["a legitimate batch-processing task could read a similarly large volume"]
      unknowns: ["whether an external export destination actually received the data"]
    behaviour:
      observable_indicators: ["cumulative read volume exceeds declared task's data need by a large margin"]
      temporal_patterns: ["reads occur in many small requests rather than one declared bulk export"]
      dependency_patterns: []
      anomalous_requests: ["read request scoped to fields outside the declared task's field list"]
    risk:
      confidentiality_impact: "HIGH"
      integrity_impact: "NONE"
      availability_impact: "NONE"
      blast_radius: "the full set of records reachable under the agent's read scope"
      reversibility: "IRREVERSIBLE"
    controls:
      prevention: ["field-level and volume-capped read scoping per declared task"]
      detection: ["compare cumulative read volume/field-set against declared task need"]
      containment: ["suspend read access pending review"]
      recovery: ["rotate any credentials used and notify affected data owners if applicable"]
    response:
      default_state: "QUARANTINED"
      escalation_conditions: ["read volume exceeds declared need by a defined multiple"]
      human_review_conditions: ["export destination cannot be confirmed as internal"]
    false_positive_controls: ["exempt tasks with a pre-declared bulk-read justification"]
    false_negative_controls: ["periodic audit of read-volume-to-declared-need ratios across all agents"]
    provenance:

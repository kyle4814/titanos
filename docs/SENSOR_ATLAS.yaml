      confidence: REPRODUCED
      source_refs: ["https://info.arxiv.org/help/api/index.html"]
      unknowns: ["exact courtesy rate-limit interval"]
    status: candidate

rejection_log:
  - sensor_id: mass_unverified_source_list
    reason: "the requesting directive asked for dozens of sources across ~10 domains; only 6 were actually fetched live this session (5 succeeded, 1 transient-failed). Listing 30+ additional 'known' sources from training-data memory without live verification would violate this document's own evidence.confidence taxonomy (REPRODUCED vs CALLER_ASSERTED) and this repository's standing no-invented-endpoints rule."
    evidence: "explicit scope decision, not a rejected sensor"

research_unknowns:
  - question: "does the mouth contract's four-state enum (FIRST_SEEN/UNCHANGED/CHANGED/UNAVAILABLE) need a fifth EXPIRED/RESOLVED state for time-bounded alert sources (e.g. NWS)?"
    why_it_matters: "without it, an adapter for any expiring-alert source silently drops resolution information — a real, evidenced contract gap, not sensor-specific"
    cheapest_probe: "write one adapter (NWS candidate) against the current four-state contract and observe exactly what information is lost on alert expiry, before proposing a contract change"
  - question: "what are the exact documented rate limits for CISA KEV, USGS, NWS, and arXiv for unauthenticated automated polling?"
    why_it_matters: "hourly cron polling of 4+ new sources could exceed courtesy limits without this being known"
    cheapest_probe: "read each source's documented usage policy page directly (not fetched this session — scope-limited to functional verification only)"

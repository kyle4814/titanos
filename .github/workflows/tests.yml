name: tests

# FRONTIER-003 (PARETO_FRONTIER.md). Runs the exact test invocation
# this repository's commit history has always used, per subsystem:
# `python3 -m unittest discover -s <subsystem> -p "test_*.py"`. No
# build step, no secrets -- the one runtime dependency (PyYAML, see
# requirements.txt) is the only thing installed before testing.
#
# Written 2026-08-25 (EXTERNAL_IDENTITY_GATE_001) before this
# repository had an actual GitHub remote -- pure content, requires no
# external state to exist. Starts running the moment this repo is
# pushed to a real GitHub repository; does nothing before that.

on:
  push:
    paths:
      - "schema/**"
      - "firewall/**"
      - "kpm/**"
      - "magl/**"
      - "rpa/**"
      - "taal/**"
      - "foundation/**"
      - "narrative/**"
      - "legacy/**"
      - "compiler/**"
      - "gems/**"
      - "provenance/**"
      - "tests/**"
      - "requirements.txt"
      - "run_all_tests.sh"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "schema/**"
      - "firewall/**"
      - "kpm/**"
      - "magl/**"
      - "rpa/**"
      - "taal/**"
      - "foundation/**"
      - "narrative/**"
      - "legacy/**"
      - "compiler/**"
      - "gems/**"
      - "provenance/**"
      - "requirements.txt"
      - "run_all_tests.sh"
      - ".github/workflows/tests.yml"

jobs:
  test:
    # New commits supersede older validation runs. Without this gate,
    # rapid TitanOS work creates a backlog of stale full-matrix runs,
    # wastes CI minutes, and sends failure emails for commits that are
    # no longer the head being evaluated.
    #
    # The group MUST include matrix.subsystem. A job-level concurrency
    # group is evaluated once per matrix job, so without it all twelve
    # jobs of one run share a single group and cancel-in-progress makes
    # them cancel each other -- 11/12 died within a second on every run
    # from e4c9500b (2026-09-23) to 0a6c6d24 (2026-09-26), leaving one
    # arbitrary survivor and no full-matrix signal. Verified from the job
    # annotation: "Canceling since a higher priority waiting request for
    # titan-os-tests-tests-refs/heads/master exists".
    concurrency:
      group: titan-os-tests-${{ github.workflow }}-${{ github.ref }}-${{ matrix.subsystem }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Keep the full matrix for correctness, but don't serialize the
      # compiler lane behind the others. A busy repository should get
      # useful signal from every independent subsystem as early as possible.
      max-parallel: 12
      matrix:
        subsystem:
          - schema
          - firewall
          - kpm
          - magl
          - rpa
          - taal
          - foundation
          - narrative
          - legacy
          - compiler
          - gems/claim_ledger
          - provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests (bounded)
        timeout-minutes: 15
        run: python3 -m unittest discover -s ${{ matrix.subsystem }} -p "test_*.py"
